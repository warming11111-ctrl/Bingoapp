<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Winners Bingo</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .logo {
      font-size: 48px;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .user-card {
      background: #0f172a;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #38bdf8;
    }
    .btn {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
      transition: opacity 0.2s;
    }
    .btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">🎲</div>
    <h1>Winners Bingo</h1>
    <p>Welcome to the live Mini App platform!</p>

    <div class="user-card" id="userInfo">
      Loading profile...
    </div>

    <button class="btn" onclick="Telegram.WebApp.close()">Close Game</button>
  </div>

  <script>
    // Initialize Telegram WebApp SDK
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Display User Information from Telegram
    const user = tg.initDataUnsafe?.user;
    const userInfoDiv = document.getElementById('userInfo');

    if (user) {
      userInfoDiv.innerHTML = `Player: <b>${user.first_name}</b> ${user.username ? '(@' + user.username + ')' : ''}`;
    } else {
      userInfoDiv.innerHTML = 'Logged in as Guest';
    }
  </script>
</body>
</html>
