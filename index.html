<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Addis Bingo</title>
  <style>
    :root {
      --bg-main: #0f172a;        /* Calm Dark Slate */
      --bg-card: #1e293b;        /* Card Background */
      --bg-card-hover: #334155;  /* Subtle Hover/Active Accent */
      
      --text-main: #f8fafc;      /* Crisp White Text */
      --text-muted: #94a3b8;     /* Muted Grey Text */
      
      --accent-blue: #0ea5e9;    /* Sky Blue for Navigation/Secondary */
      --accent-green: #10b981;   /* Emerald Green for Primary Actions */
      --accent-gold: #f59e0b;    /* Warm Gold for Called Numbers & Bingo */
      --accent-red: #ef4444;     /* Warning/Penalty Red */
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      overflow: hidden;
    }

    /* TOP HEADER BAR */
    .top-bar {
      background: var(--bg-card);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--bg-card-hover);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
    }

    .balances {
      display: flex;
      gap: 8px;
    }

    .stat-chip {
      background: var(--bg-main);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--bg-card-hover);
    }

    .stat-chip span {
      color: var(--accent-gold);
    }

    /* MAIN CONTENT VIEW */
    .view-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* GAME SCREEN COMPONENTS */
    .jackpot-banner {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid var(--accent-gold);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.1);
    }

    .jackpot-title {
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--accent-gold);
      text-transform: uppercase;
      font-weight: 700;
    }

    .jackpot-amount {
      font-size: 22px;
      font-weight: 800;
      margin: 2px 0 8px;
    }

    .progress-bar-bg {
      background: var(--bg-main);
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: var(--accent-gold);
      height: 100%;
      width: 46%;
      border-radius: 3px;
    }

    /* BINGO NUMBER GRID */
    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
      background: var(--bg-card);
      padding: 10px;
      border-radius: var(--radius-md);
      border: 1px solid var(--bg-card-hover);
    }

    .tile {
      aspect-ratio: 1;
      background: var(--bg-main);
      color: var(--text-muted);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .tile.called {
      background: var(--accent-gold);
      color: #000;
      font-weight: 800;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
      transform: scale(1.05);
    }

    /* ACTION CONTROLS */
    .action-row {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-secondary {
      background: var(--bg-card-hover);
      color: var(--text-main);
    }

    .btn-bingo {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      flex: 2;
    }

    .btn-bingo:active {
      transform: scale(0.98);
    }

    /* FAIRNESS FOOTER CARD */
    .fairness-card {
      background: var(--bg-card);
      padding: 12px;
      border-radius: var(--radius-md);
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hash-text {
      font-family: monospace;
      color: var(--accent-blue);
      word-break: break-all;
    }

    /* BOTTOM NAV BAR */
    .bottom-nav {
      background: var(--bg-card);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid var(--bg-card-hover);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent-blue);
    }

    .nav-icon {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-bar">
    <div class="user-info">
      <div class="avatar">N</div>
      <div>
        <div style="font-weight: 700; font-size: 14px;">Natty</div>
        <div style="font-size: 10px; color: var(--text-muted);">Verified</div>
      </div>
    </div>
    <div class="balances">
      <div class="stat-chip">Bal: <span>0.27 ETB</span></div>
      <div class="stat-chip">Stake: <span>10</span></div>
    </div>
  </header>

  <!-- Main Display Screen -->
  <main class="view-container">

    <!-- Jackpot Visual Banner -->
    <section class="jackpot-banner">
      <div class="jackpot-title">Room Jackpot</div>
      <div class="jackpot-amount">462.40 / 1000 ETB</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill"></div>
      </div>
    </section>

    <!-- 10x10 Clean Bingo Board Grid -->
    <section class="bingo-grid" id="board">
      <!-- 100 Tiles generated dynamically via JavaScript -->
    </section>

    <!-- Primary User Controls -->
    <section class="action-row">
      <button class="btn btn-secondary">Refresh</button>
      <button class="btn btn-bingo" onclick="triggerBingo()">BINGO!</button>
    </section>

    <!-- Provably Fair Hash Information -->
    <section class="fairness-card">
      <div style="display: flex; justify-content: space-between;">
        <span>Provably Fair Hash</span>
        <span style="color: var(--text-main); font-weight: 600;">ID: #GS3747</span>
      </div>
      <div class="hash-text">2eedd89e7b6d31b000c9d9e11aca49ee98450afe9ca132dc59dc6387ceaa8f6</div>
    </section>

  </main>

  <!-- Bottom Main Menu Navigation -->
  <nav class="bottom-nav">
    <div class="nav-item active">
      <div class="nav-icon">🎮</div>
      <span>Game</span>
    </div>
    <div class="nav-item">
      <div class="nav-icon">🏆</div>
      <span>Scores</span>
    </div>
    <div class="nav-item">
      <div class="nav-icon">📜</div>
      <span>History</span>
    </div>
    <div class="nav-item">
      <div class="nav-icon">👛</div>
      <span>Wallet</span>
    </div>
    <div class="nav-item">
      <div class="nav-icon">👤</div>
      <span>Profile</span>
    </div>
  </nav>

  <script>
    // Generate Grid Numbers (1-100)
    const board = document.getElementById('board');
    const calledNumbers = [22, 36, 60, 74]; // Example called numbers

    for (let i = 1; i <= 100; i++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      if (calledNumbers.includes(i)) {
        tile.classList.add('called');
      }
      tile.innerText = i;
      board.appendChild(tile);
    }

    function triggerBingo() {
      alert("Checking Bingo validation...");
    }
  </script>

</body>
</html>
