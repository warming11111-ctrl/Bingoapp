<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Addis Bingo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    :root {
      --bg-main: #0f172a;        /* Calm Dark Slate */
      --bg-card: #1e293b;        /* Card Background */
      --bg-card-hover: #334155;  /* Subtle Accent Border */
      
      --text-main: #f8fafc;      /* White Text */
      --text-muted: #94a3b8;     /* Muted Grey */
      
      --accent-blue: #0ea5e9;    /* Sky Blue */
      --accent-green: #10b981;   /* Emerald Green */
      --accent-gold: #f59e0b;    /* Warm Gold for Called/Bingo */
      --accent-red: #ef4444;     /* Warning/Penalty Red */
      
      --radius-sm: 8px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* Modal Overlay for Card Selection */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.95);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
    }
    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--bg-card-hover);
      border-radius: var(--radius-md);
      padding: 16px; width: 100%; max-width: 340px; text-align: center;
    }
    .modal-btn {
      background: var(--accent-blue); color: white; border: none;
      padding: 10px; margin-top: 8px; border-radius: var(--radius-sm);
      font-weight: bold; width: 100%; cursor: pointer;
    }

    /* Header Bar */
    .header { text-align: center; margin-bottom: 8px; }
    .header h1 { font-size: 20px; color: var(--accent-gold); font-weight: 800; }
    .header p { font-size: 11px; color: var(--accent-blue); }

    /* Top Stats */
    .stats-bar {
      display: flex; justify-content: space-between; width: 100%; max-width: 340px;
      background: var(--bg-card); padding: 8px 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--bg-card-hover); margin-bottom: 8px; font-size: 12px; color: var(--text-muted);
    }
    .stats-bar span { color: var(--text-main); font-weight: bold; }

    /* Number Caller Bar */
    .caller-section {
      width: 100%; max-width: 340px; background: var(--bg-card); border: 1px solid var(--bg-card-hover);
      border-radius: var(--radius-md); padding: 10px; margin-bottom: 8px; display: flex; flex-direction: column; align-items: center;
    }
    .ball-container { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .current-ball {
      width: 54px; height: 54px; background: var(--accent-gold); color: #0f172a; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
    }
    .mini-ball { width: 28px; height: 28px; background: var(--bg-main); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: var(--text-muted); }

    /* Bingo Grid */
    .bingo-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; max-width: 340px;
      background: var(--bg-card); padding: 10px; border-radius: var(--radius-md); border: 1px solid var(--bg-card-hover);
    }
    .grid-header { font-weight: 900; text-align: center; color: var(--accent-gold); font-size: 16px; }
    .cell {
      background: var(--bg-main); border: 1px solid var(--bg-card-hover); border-radius: var(--radius-sm);
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-weight: 700;
      font-size: 15px; cursor: pointer; color: var(--text-main);
    }
    .cell.marked { background: var(--accent-green); color: #fff; border-color: #34d399; }
    .cell.free { background: var(--accent-blue); color: #fff; font-size: 10px; }

    /* Bingo Button */
    .bingo-btn {
      width: 100%; max-width: 340px; margin-top: 10px; padding: 12px; font-size: 16px; font-weight: 900;
      color: #fff; background: var(--bg-card-hover); border: none; border-radius: var(--radius-md);
      cursor: not-allowed; opacity: 0.6; text-transform: uppercase;
    }
    .bingo-btn.ready { background: var(--accent-gold); color: #000; cursor: pointer; opacity: 1; box-shadow: 0 0 15px rgba(245, 158, 11, 0.5); }
    .bingo-btn.penalized { background: var(--accent-red) !important; color: #fff !important; cursor: not-allowed !important; }

    .win-banner { display: none; margin-top: 10px; padding: 10px; background: var(--bg-card); border: 1px solid var(--accent-green); color: white; border-radius: 8px; font-size: 12px; width: 100%; max-width: 340px; }
  </style>
</head>
<body>

  <!-- Modal for Board Selection -->
  <div id="cardSelectionModal" class="modal-overlay">
    <div class="modal-content">
      <h2 style="color: var(--accent-gold); margin-bottom: 8px;">Select Card Board</h2>
      <div class="bingo-grid" id="previewGrid" style="pointer-events: none; margin-bottom: 10px;"></div>
      <button class="modal-btn" onclick="regeneratePreviewBoard()">🎲 Roll New Board</button>
      <button class="modal-btn" style="background: var(--accent-green);" onclick="confirmBoardSelection()">✅ Confirm & Join</button>
    </div>
  </div>

  <div class="header">
    <h1>🏆 ADDIS BINGO</h1>
    <p id="playerLabel">Player: Natty</p>
  </div>

  <div class="stats-bar">
    <div>Status: <span id="connStatus">Connecting...</span></div>
    <div>Players: <span id="playerCount">1</span></div>
  </div>

  <div class="caller-section">
    <div class="ball-container">
      <div id="calledNumber" class="current-ball">--</div>
      <div style="display:flex; gap:4px;" id="historyContainer"></div>
    </div>
  </div>

  <div class="bingo-grid" id="bingoGrid">
    <div class="grid-header">B</div><div class="grid-header">I</div><div class="grid-header">N</div><div class="grid-header">G</div><div class="grid-header">O</div>
  </div>

  <button id="bingoBtn" class="bingo-btn" onclick="pressBingoBtn()">BINGO!</button>
  <div id="winBanner" class="win-banner"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();

    const playerName = tg.initDataUnsafe?.user?.first_name || "Natty";
    document.getElementById('playerLabel').innerText = `Player: ${playerName}`;

    const socket = io("https://bingoapp-backend-pbav.onrender.com");

    let boardState = Array(25).fill(false);
    let boardValues = [];
    let previewBoardValues = [];
    let isPenalized = false;
    let penaltyTimer = null;

    socket.on('connect', () => {
      document.getElementById('connStatus').innerText = "🟢 Live";
      socket.emit('joinRoom', { roomId: 'global', playerName });
      regeneratePreviewBoard();
    });

    socket.on('disconnect', () => { document.getElementById('connStatus').innerText = "🔴 Offline"; });
    socket.on('playerCountUpdate', (count) => { document.getElementById('playerCount').innerText = count; });

    socket.on('ballDrawn', (data) => {
      document.getElementById('calledNumber').innerText = data.number;
      const hist = document.getElementById('historyContainer');
      hist.innerHTML = '';
      data.history.slice(-4, -1).reverse().forEach(n => {
        const mini = document.createElement('div'); mini.className = 'mini-ball'; mini.innerText = n; hist.appendChild(mini);
      });
    });

    socket.on('falseBingoPenalty', (data) => {
      isPenalized = true;
      let left = data.penaltyDuration;
      const btn = document.getElementById('bingoBtn');
      btn.classList.add('penalized');
      btn.innerText = `PENALTY (${left}s)`;
      alert(`⚠️ Strike ${data.strikes}/2: False BINGO claim!`);

      if (penaltyTimer) clearInterval(penaltyTimer);
      penaltyTimer = setInterval(() => {
        left--;
        if (left > 0) btn.innerText = `PENALTY (${left}s)`;
        else {
          clearInterval(penaltyTimer);
          isPenalized = false;
          btn.classList.remove('penalized');
          btn.innerText = "BINGO!";
        }
      }, 1000);
    });

    socket.on('playerKicked', (data) => {
      alert(`⛔ ${data.reason}`);
      document.getElementById('cardSelectionModal').style.display = 'flex';
      regeneratePreviewBoard();
    });

    function regeneratePreviewBoard() {
      previewBoardValues = [];
      const cols = [
        getRand(1,15), getRand(16,30), getRand(31,45), getRand(46,60), getRand(61,75)
      ];
      for(let r=0; r<5; r++) for(let c=0; c<5; c++) previewBoardValues.push(cols[c][r]);

      const grid = document.getElementById('previewGrid');
      grid.innerHTML = `<div class="grid-header">B</div><div class="grid-header">I</div><div class="grid-header">N</div><div class="grid-header">G</div><div class="grid-header">O</div>`;
      previewBoardValues.forEach((val, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.innerText = i === 12 ? 'FREE' : val;
        if(i === 12) cell.classList.add('marked', 'free');
        grid.appendChild(cell);
      });
    }

    function confirmBoardSelection() {
      boardValues = [...previewBoardValues];
      boardState = Array(25).fill(false);
      const grid = document.getElementById('bingoGrid');
      grid.innerHTML = `<div class="grid-header">B</div><div class="grid-header">I</div><div class="grid-header">N</div><div class="grid-header">G</div><div class="grid-header">O</div>`;
      boardValues.forEach((val, idx) => {
        const cell = document.createElement('div');
        cell.className = 'cell'; cell.id = `cell-${idx}`;
        if (idx === 12) {
          cell.innerText = 'FREE'; cell.classList.add('marked', 'free'); boardState[12] = true;
        } else {
          cell.innerText = val;
          cell.onclick = () => {
            boardState[idx] = !boardState[idx];
            cell.classList.toggle('marked');
            document.getElementById('bingoBtn').classList.add('ready');
          };
        }
        grid.appendChild(cell);
      });
      document.getElementById('cardSelectionModal').style.display = 'none';
      socket.emit('selectBoard', { board: boardValues });
    }

    function getRand(min, max) {
      const a = []; while(a.length < 5) { const r = Math.floor(Math.random()*(max-min+1))+min; if(!a.includes(r)) a.push(r); } return a;
    }

    function pressBingoBtn() {
      if (!isPenalized) socket.emit('claimBingo', { playerName });
    }
  </script>
</body>
</html>
